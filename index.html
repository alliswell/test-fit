
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Test Fit — Drafting Instrument</title>
      <!-- Only the faces the UI actually renders: Saira Condensed 600 (display headers,
           wordmark) and IBM Plex Mono 400/500/600 (everything else). IBM Plex Sans was
           only ever a fallback in the `display` stack and never loaded. The stylesheet is
           preloaded so font discovery doesn't wait on first paint. -->
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
      <link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    </head>

    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
